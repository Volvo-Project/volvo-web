    <div class="page-heading header-text">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <h3>Iniciar sesion</h3>
                    <span>Ingresa con tu correo y contraseña</span>
                </div>
            </div>
        </div>
    </div>
    <main class="container">
      <form id="formLogin" novalidate>

        <div class="campo">
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" maxlength="100">
          <span class="error" id="errorCorreo"></span>
        </div>

        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" maxlength="10">
          <span class="error" id="errorContrasena"></span>
        </div>


        <button type="submit">Ingresar</button>
        <p id="aviso" class="aviso" hidden></p>

      </form>
    </main>
