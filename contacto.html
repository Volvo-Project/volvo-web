    <div class="page-heading header-text">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <h3>Contacto</h3>
                    <span>Completa el formulario y te responderemos</span>
                </div>
            </div>
        </div>
    </div>
    <main class="container">
      <form id="formContacto" novalidate>

        <!-- Campo 1: Nombre (HECHO, de ejemplo) -->
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" maxlength="100">
          <span class="error" id="errorNombre"></span>
        </div>

        <div class="campo">
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" maxlength="100">
          <span class="error" id="errorCorreo"></span>
        </div>
        <div class="campo">
          <label for="comentario">Comentario</label>
          <textarea id="comentario" name="comentario" maxlength="500"></textarea>
          <span class="error" id="errorComentario"></span>
        </div>
        

        <button type="submit">Enviar</button>
        <p id="aviso" class="aviso" hidden></p>

      </form>
    </main>
