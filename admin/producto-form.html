<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volvo | Admin | Nuevo producto</title>
    <meta name="description" content="Volvo, tienda online de videojuegos: catálogo, ofertas y novedades.">

    <link href="../vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/fontawesome.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/owl.css">
    <link rel="stylesheet" href="../assets/css/animate.css">
    <link rel="stylesheet" href="../assets/css/estilos.css">

    <script src="../assets/js/guardia-admin.js"></script>
</head>

<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <nav>
                <ul>
                    <li><a href="home.html">Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="usuarios.html">Usuarios</a></li>
                    <li><a href="../index.html">Volver a la tienda</a></li>
                </ul>
            </nav>
        </aside>
        <main class="admin-content">
            <h1>Nuevo / Editar producto</h1>
                <form id="form-producto" novalidate>
                    <div class="campo">
                        <label for="prod-codigo">Código producto</label>
                        <input type="text" id="prod-codigo" name="codigo">
                        <span class="error"></span>
                    </div>
                    <div class="campo">
                        <label for="prod-nombre">Nombre</label>
                        <input type="text" id="prod-nombre" name="nombre">
                        <span class="error"></span>
                    </div>
                    <div class="campo">
                        <label for="prod-descripcion">Descripción</label>
                        <textarea id="prod-descripcion" name="descripcion"></textarea>
                        <span class="error"></span>
                    </div>
                    <div class="campo">
                        <label for="prod-precio">Precio</label>
                        <input type="number" id="prod-precio" name="precio">
                        <span class="error"></span>
                    </div>
                    <div class="campo">
                        <label for="prod-stock">Stock</label>
                        <input type="number" id="prod-stock" name="stock">
                        <span class="error"></span>
                    </div>
                    <div class="campo">
                        <label for="prod-stock-critico">Stock crítico</label>
                        <input type="number" id="prod-stock-critico" name="stockCritico">
                        <span class="error"></span>
                    </div>
                    <div class="campo">
                        <label for="prod-categoria">Categoría</label>
                        <select id="prod-categoria" name="categoria">
                            <option value="Aventura">Aventura</option>
                            <option value="Estrategia">Estrategia</option>
                            <option value="Carreras">Carreras</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="prod-imagen">Imagen (URL)</label>
                        <input type="text" id="prod-imagen" name="imagen">
                    </div>
                    <button type="submit">Guardar</button>
                </form>
                <p id="aviso" hidden></p>

        </main>
    </div>
    <script src="../assets/js/productos.js"></script>
    <script src="../assets/js/admin-productos.js"></script>
    <script src="../assets/js/admin-producto-form.js"></script>
</body>

</html>
