        <div class="preloader-inner">
            <span class="dot"></span>

        <div class="container">
            <div class="row">
                <div class="col-12">
                    <nav class="main-nav">
                        <a href="index.html" class="logo">
                            <img src="assets/images/volvo logo.png" alt="Logo volvo" style="width: 200px; margin: 10px; padding: 10px;">
                        </a>
                        <ul class="nav">
                            <li><a href="index.html">Inicio</a></li>
                            <li><a href="producto.html">Productos</a></li>
                            <li><a href="nosotros.html">Nosotros</a></li>

                        </ul>

                    </nav>
                </div>
            </div>
        </div>
    </header>

    <div class="page-heading header-text">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <h3>Crear cuenta</h3>
                    <span>Regístrate para comprar en Volvo</span>
                </div>
            </div>
        </div>
    </div>

    <main class="container py-5 d-flex justify-content-center">
        <form id="formRegistro" novalidate class="p-4 shadow rounded" style="max-width: 400px; width: 100%;">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" maxlength="60" placeholder="Ingrese su nombre" required>
                <span class="error text-danger small" id="errorNombre"></span>
            </div>

            <div class="mb-3">
                <label for="correoRegistro" class="form-label">Correo</label>
                <input type="email" class="form-control" id="correoRegistro" maxlength="100" placeholder="Ingrese su correo" required>
                <span class="error text-danger small" id="errorCorreoRegistro"></span>
            </div>

            <div class="mb-3">
                <label for="contrasenaRegistro" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="contrasenaRegistro" maxlength="10" placeholder="Entre 4 y 10 caracteres" required>
                <span class="error text-danger small" id="errorContrasenaRegistro"></span>
            </div>

            <div class="mb-3">
                <label for="confirmarContrasena" class="form-label">Confirmar contraseña</label>
                <input type="password" class="form-control" id="confirmarContrasena" maxlength="10" placeholder="Repita su contraseña" required>
                <span class="error text-danger small" id="errorConfirmarContrasena"></span>
            </div>

            <button type="submit" class="btn btn-primary w-100">Registrarse</button>
            <p id="avisoRegistro" class="aviso mt-3 text-center" hidden></p>
        </form>
    </main>

                    <a rel="nofollow" href="https://github.com/EmilianoCerda" target="_blank">Emiliano Cerda</a></p>
            </div>
        </div>
    </footer>

    <script src="vendor/jquery/jquery.min.js"></script>
